<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Artivism</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <script>
    // Redirect to the home page
    const segmentCount = 1; // Adjust based on your repo name (usually 1 for repo at username.github.io/repo-name)
    const redirectPath = sessionStorage.getItem('redirectPath') || '/';
    const path = window.location.pathname.split('/').slice(0, 1 + segmentCount).join('/');
    window.location.href = path + redirectPath;
  </script>
</body>
</html>
